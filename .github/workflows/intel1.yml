    - cron: "00 10 29 11 *"
    - cron: "00 21 29 11 *"
    - cron: "30 04 05 12 *"
    - cron: "00 07 06 12 *"
    - cron: "00 18 06 12 *"
  workflow_dispatch:
    inputs:
      force_weekend_id:
        description: "Optional weekend ID override"
        required: false
        type: string
      force_stage:
        description: "Optional stage override"
        required: false
        type: string
      dry_run:
        description: "Generate without publishing"
        required: false
        default: true
        type: boolean
      skip_ai:
        description: "Use deterministic pipeline only"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m pytest

  pipeline:
    name: Generate race intelligence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_EXTRACT_MODEL: ${{ vars.OPENAI_EXTRACT_MODEL }}
      OPENAI_SUMMARY_MODEL: ${{ vars.OPENAI_SUMMARY_MODEL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      INTEL1_PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/intel1-data
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous state
        shell: bash
        run: |
          mkdir -p output/live
          git fetch origin intel1-data || true
          for f in app_manifest latest_prediction prediction_arena ai_extraction_cache learning_state prediction_history current_standings standings_update_state; do
            git show "origin/intel1-data:${f}.json" > "output/live/${f}.json" 2>/dev/null || true
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run pipeline
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--output-dir output/live --source-registry config/source_registry.json --public-base-url "${INTEL1_PUBLIC_BASE_URL}" --skip-drive-upload)

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            ARGS+=(--scheduled)
          fi
          if [[ -n "${{ inputs.force_weekend_id }}" ]]; then
            ARGS+=(--force-weekend-id "${{ inputs.force_weekend_id }}")
          fi
          if [[ -n "${{ inputs.force_stage }}" ]]; then
            ARGS+=(--force-stage "${{ inputs.force_stage }}")
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          if [[ "${{ inputs.skip_ai }}" == "true" ]]; then
            ARGS+=(--skip-ai)
            export INTEL1_OPENAI_PREDICTION_ENABLED=false
          else
            export INTEL1_OPENAI_PREDICTION_ENABLED=true
          fi
          export INTEL1_OPENAI_SUMMARY_ENABLED=false

          python -m intel1_pipeline "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: intel1-output
          path: output/live/*.json
          if-no-files-found: warn

      - name: Publish JSON
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f output/live/app_manifest.json ]] || exit 0
          publish_dir="$(mktemp -d)"
          cp output/live/*.json "${publish_dir}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan intel1-data
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "${publish_dir}"/*.json .
          touch .nojekyll
          git add .nojekyll *.json
          git commit -m "Publish INTEL1 data ${GITHUB_RUN_ID}"
          git push --force origin intel1-data
