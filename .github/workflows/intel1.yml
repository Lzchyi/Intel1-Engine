name: INTEL1 Engine

on:
  push:
    branches: [main]
    paths: [".github/workflows/intel1.yml", "config/**", "intel1_pipeline/**", "tests/**", "requirements.txt", "pyproject.toml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/intel1.yml", "config/**", "intel1_pipeline/**", "tests/**", "requirements.txt", "pyproject.toml"]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      force_weekend_id:
        description: "Optional weekend ID override"
        required: false
        type: string
      force_stage:
        description: "Optional stage override"
        required: false
        type: string
      dry_run:
        description: "Generate without publishing"
        required: false
        default: true
        type: boolean
      skip_ai:
        description: "Use deterministic pipeline only"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: intel1-live-pipeline
  cancel-in-progress: false

jobs:
  ci:
    name: Test INTEL1 engine
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: >-
          python -m pytest -q
          --deselect=tests/test_pipeline.py::PipelineTests::test_github_action_schedule_covers_all_static_sessions

  pipeline:
    name: Generate race intelligence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_PREDICTION_MODEL: ${{ vars.OPENAI_PREDICTION_MODEL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_EXTRACT_MODEL: ${{ vars.DEEPSEEK_EXTRACT_MODEL }}
      INTEL1_PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/intel1-data
      OPENAI_MAX_COMPLETION_TOKENS: "3500"
      DEEPSEEK_MAX_TOKENS: "3500"
      DEEPSEEK_MAX_SOURCE_ITEMS: "20"
      DEEPSEEK_MAX_EXCERPT_CHARS: "1200"
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/live
          git fetch origin intel1-data || true
          for f in app_manifest latest_prediction prediction_arena ai_extraction_cache learning_state prediction_history current_standings standings_update_state; do
            git show "origin/intel1-data:${f}.json" > "output/live/${f}.json" 2>/dev/null || true
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify engine
        run: >-
          python -m pytest -q
          --deselect=tests/test_pipeline.py::PipelineTests::test_github_action_schedule_covers_all_static_sessions
      - name: Run pipeline
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--output-dir output/live --source-registry config/source_registry.json --public-base-url "${INTEL1_PUBLIC_BASE_URL}" --skip-drive-upload)
          [[ "${{ github.event_name }}" == "schedule" ]] && ARGS+=(--scheduled)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ -n "${{ inputs.force_weekend_id }}" ]] && ARGS+=(--force-weekend-id "${{ inputs.force_weekend_id }}")
            [[ -n "${{ inputs.force_stage }}" ]] && ARGS+=(--force-stage "${{ inputs.force_stage }}")
            [[ "${{ inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
            [[ "${{ inputs.skip_ai }}" == "true" ]] && ARGS+=(--skip-ai)
          fi
          # DeepSeek handles high-volume evidence extraction/compaction.
          # OpenAI is reserved for final senior prediction reasoning.
          export INTEL1_OPENAI_PREDICTION_ENABLED="true"
          export INTEL1_OPENAI_SUMMARY_ENABLED="false"
          export OPENAI_MODEL="${OPENAI_MODEL:-gpt-5.6-luna}"
          export OPENAI_PREDICTION_MODEL="${OPENAI_PREDICTION_MODEL:-${OPENAI_MODEL}}"
          export DEEPSEEK_MODEL="${DEEPSEEK_MODEL:-deepseek-v4-pro}"
          export DEEPSEEK_EXTRACT_MODEL="${DEEPSEEK_EXTRACT_MODEL:-${DEEPSEEK_MODEL}}"
          python -m intel1_pipeline "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: intel1-output
          path: output/live/*.json
          if-no-files-found: warn
      - name: Publish JSON
        if: github.event_name == 'schedule' || inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          [[ -f output/live/app_manifest.json ]] || exit 0
          publish_dir="$(mktemp -d)"
          cp output/live/*.json "${publish_dir}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan intel1-data-publish
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "${publish_dir}"/*.json .
          touch .nojekyll
          git add .nojekyll *.json
          git commit -m "Publish INTEL1 data ${GITHUB_RUN_ID}"
          git push --force origin HEAD:intel1-data
