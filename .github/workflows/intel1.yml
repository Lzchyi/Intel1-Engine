    - cron: "00 18 26 07 *"
    - cron: "00 04 22 08 *"
    - cron: "00 07 23 08 *"
    - cron: "00 18 23 08 *"
    - cron: "30 04 05 09 *"
    - cron: "00 07 06 09 *"
    - cron: "00 18 06 09 *"
    - cron: "30 04 12 09 *"
    - cron: "00 07 13 09 *"
    - cron: "00 18 13 09 *"
    - cron: "30 02 25 09 *"
    - cron: "00 05 26 09 *"
    - cron: "00 16 26 09 *"
    - cron: "30 02 03 10 *" # R16 Sepang: Saturday forecast
    - cron: "00 05 04 10 *" # R16 Sepang: race forecast
    - cron: "00 16 04 10 *" # R16 Sepang: post-race learning
    - cron: "00 03 10 10 *"
    - cron: "00 06 11 10 *"
    - cron: "00 17 11 10 *"
    - cron: "30 11 24 10 *"
    - cron: "00 14 25 10 *"
    - cron: "00 01 26 10 *"
    - cron: "30 11 31 10 *"
    - cron: "00 14 01 11 *"
    - cron: "00 01 02 11 *"
    - cron: "30 08 07 11 *"
    - cron: "00 11 08 11 *"
    - cron: "00 22 08 11 *"
    - cron: "30 18 20 11 *"
    - cron: "00 22 21 11 *"
    - cron: "00 09 22 11 *"
